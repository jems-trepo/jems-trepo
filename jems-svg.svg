<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 380" width="100%" height="100%">
  <style>
    .bg { fill: #0d1117; rx: 10px; }
    .header { fill: #161b22; }
    .button-red { fill: #ff5f56; }
    .button-yellow { fill: #ffbd2e; }
    .button-green { fill: #27c93f; }
    .title { fill: #8b949e; font-family: monospace; font-size: 13px; }
    
    .ascii-text {
      font-family: 'Courier New', Courier, monospace;
      font-size: 11px;
      fill: #58a6ff;
      white-space: pre;
      font-weight: bold;
    }

    .subtitle {
      font-family: 'Courier New', Courier, monospace;
      font-size: 13px;
      fill: #79c0ff;
    }

    /* Reveals line-by-line ONCE (2.5s) and stays still permanently */
    @keyframes scanline {
      0% { clip-path: inset(0 0 100% 0); }
      100% { clip-path: inset(0 0 0 0); }
    }

    /* Terminal cursor blinks during reveal, then fades away */
    @keyframes blink-then-fade {
      0%, 80% { opacity: 1; }
      100% { opacity: 0; }
    }

    .animated-art {
      animation: scanline 2.5s ease-out forwards;
    }

    .cursor {
      fill: #58a6ff;
      animation: blink-then-fade 2.8s forwards;
    }
  </style>

  <!-- Terminal Frame -->
  <rect class="bg" width="850" height="380" />
  <path class="header" d="M 0,10 A 10,10 0 0,1 10,0 L 840,0 A 10,10 0 0,1 850,10 L 850,35 L 0,35 Z" />
  <circle class="button-red" cx="20" cy="18" r="6" />
  <circle class="button-yellow" cx="40" cy="18" r="6" />
  <circle class="button-green" cx="60" cy="18" r="6" />
  <text class="title" x="425" y="22" text-anchor="middle">gems.sh — bash</text>

  <!-- ASCII Gem Word Art -->
  <g class="animated-art">
    <text class="ascii-text" x="30" y="45">
      <tspan x="30" dy="1.2em">   ██╗███████╗███╗   ███╗███████╗</tspan>
      <tspan x="30" dy="1.2em">   ██║██╔════╝████╗ ████║██╔════╝</tspan>
      <tspan x="30" dy="1.2em">   ██║█████╗  ██╔████╔██║███████╗</tspan>
      <tspan x="30" dy="1.2em">██╗██║██╔══╝  ██║╚██╔╝██║╚════██║</tspan>
      <tspan x="30" dy="1.2em">╚████║███████╗██║ ╚═╝ ██║███████║</tspan>
      <tspan x="30" dy="1.2em"> ╚═══╝╚══════╝╚═╝     ╚═╝╚══════╝</tspan>
      <tspan x="30" dy="1.2em">                                 </tspan>
      <tspan x="30" dy="1.2em">  ◆ Crafting Digital Experiences &amp; Clean Code ◆</tspan>
    </text>
  </g>

  <!-- Terminal Cursor -->
  <rect class="cursor" x="30" y="325" width="8" height="16" />
</svg>
